server:
  shutdown: graceful
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8
spring:
  application:
    name: demo
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
  ai:
    mcp:
      client:
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: true
        sse:
          baidu-mcp:
            url: https://mcp.map.baidu.com/sse
            headers:
              ak: YOUR_BAIDU_MAP_AK
    dashscope:
      api-key: YOUR_DASHSCOPE_API_KEY
      connect-timeout-ms: 10000
      read-timeout-ms: 60000
      chat:
        options:
          stream: true
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      redis:
        initialize-schema: false
        index-name: atguigu-index
        prefix: atguigu-prefix
        summary-index-name: atguigu-summary-index
        summary-prefix: atguigu-summary-prefix
        ttl-seconds: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://39.108.175.183:3306/rag_knowledge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      leak-detection-threshold: 10000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 30000
  data:
    redis:
      client-type: jedis          # Spring Boot 3.5+ 需要显式指定，否则不会自动配置 JedisConnectionFactory
      host: 120.24.238.51
      port: 6379
      password: YOUR_REDIS_PASSWORD
      database: 0
      timeout: 60000ms
      connect-timeout: 30000ms
      jedis:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 60000ms
          time-between-eviction-runs: 30000ms
          min-evictable-idle-time: 60000ms
  rabbitmq:
    host: 120.24.238.51
    port: 5672
    username: rabbitmq
    password: YOUR_RABBITMQ_PASSWORD
    virtual-host: /
    connection-timeout: 30000
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        acknowledge-mode: manual
        prefetch: 1
        idle-event-interval: 7200000
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3

minio:
  endpoint: http://39.108.175.183:9000
  access-key: minioadmin
  secret-key: YOUR_MINIO_SECRET_KEY
  bucket: rag-knowledge

file:
  upload:
    temp-dir: ./temp/chunks

aliyun:
  asr:
    access-key-id: ${ALIYUN_ASR_ACCESS_KEY_ID:your-aliyun-asr-access-key-id}
    access-key-secret: ${ALIYUN_ASR_ACCESS_KEY_SECRET:your-aliyun-asr-access-key-secret}
    app-key: ${ALIYUN_ASR_APP_KEY:your-aliyun-asr-app-key}

asr:
  provider-order:
    - aliyun-nls
    - dashscope-paraformer
  dashscope:
    enabled: true
    api-key: YOUR_DASHSCOPE_API_KEY
    model: paraformer-realtime-v2
    format: pcm
    sample-rate: 16000

video:
  segment-duration: 30
  keyframe-interval: 5

chunking:
  fixed:
    chunk-size: 1000
    overlap: 200
  token:
    default-chunk-size: 800
    ppt-chunk-size: 1000
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    keep-separator: true

chat:
  memory:
    max-messages: 10
    summarize-threshold: 12
    assistant-truncate-length: 300
    summary-max-length: 500

rag:
  retrieval:
    candidate-top-k: 15
    similarity-threshold: 0.3
    final-top-k: 5
    hit-score-threshold: 0.35
  rerank:
    model: gte-rerank-v2

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid

auth:
  password-recovery:
    expose-reset-code: false

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
      - http://127.0.0.1:3000
  mail:
    from: ${spring.mail.username:}
    fallback-dir: ./temp/emails

mineru:
  api-key: YOUR_MINERU_API_KEY
  model-version: vlm

resilience4j:
  circuitbreaker:
    instances:
      dashscope-chat:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 10s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      dashscope-rerank:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      dashscope-chat:
        timeout-duration: 60s
        cancel-running-future: false

# S-2: Actuator security - restrict to health & info, hide details unless authorized
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true

